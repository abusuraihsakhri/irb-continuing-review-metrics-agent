[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "irb-continuing-review-metrics-engine"
version = "2.0.1"
description = "Rule-based IRB protocol metrics demonstration and evaluation utilities"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
test = ["pytest>=7,<10", "httpx>=0.24,<1", "fastapi>=0.100,<1"]

[project.scripts]
irb-continuing-review-metrics-engine = "irb_compliance.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/irb-continuing-review-metrics-agent"
Repository = "https://github.com/abusuraihsakhri/irb-continuing-review-metrics-agent"
