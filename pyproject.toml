[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "irb-continuing-review-metrics-engine"
version = "2.0.0"
description = "IRB-Compliance: Institutional Review Board Protocol Safety Metric Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
irb-continuing-review-metrics-engine = "irb_compliance.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/irb-continuing-review-metrics-engine"
Repository = "https://github.com/abusuraihsakhri/irb-continuing-review-metrics-engine.git"
