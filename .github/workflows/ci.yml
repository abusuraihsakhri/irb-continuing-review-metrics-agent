name: Python tests and static validation

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: ci-only-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[server,test]"
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents irb_compliance cli.py enrichment.py simulator.py
      - name: Python regression tests
        run: python -m pytest -q
      - name: Check browser JavaScript
        run: node --check web/app.js
      - name: Browser rule regression tests
        run: node --test tests/web.test.cjs
      - name: Verify HMAC audit integrity
        run: |
          python -c "from agents.base import AuditTrail; a = AuditTrail('ci-test-key'); a.log('test', 'ci', 'test', {'status': 'ok'}); assert a.verify_integrity(); a.logs[0]['event_type'] = 'altered'; assert not a.verify_integrity()"
